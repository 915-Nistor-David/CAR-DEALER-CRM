# Suprascriere pentru demo prin Cloudflare Tunnel:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# Cloudflare termina TLS-ul, deci Caddy serveste HTTP simplu si nu mai are nevoie
# de portul 443 sau de certificate. Restul stivei ramane neschimbat — aceleasi
# imagini, aceeasi baza de date, acelasi volum de poze, aceeasi rutare.

services:
  web:
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # `!override` e OBLIGATORIU: Compose combina listele prin ADAUGARE, nu prin
    # inlocuire. Fara el, serviciul mosteneste si "80:80" din fisierul de baza,
    # cere acelasi port de doua ori si esueaza cu "address already in use" —
    # aratand ca si cand altcineva l-ar fi ocupat.
    ports: !override
      # Port inalt si doar pe loopback: singurul client e cloudflared, care
      # ruleaza pe aceeasi masina. Nimic nu e expus in retea.
      - "127.0.0.1:18080:80"
    environment:
      APP_HOST: ${PUBLIC_APP_HOST:?lipseste din .env}
      API_HOST: ${PUBLIC_API_HOST:?lipseste din .env}
      # ACME_EMAIL nu se foloseste in modul tunel, dar variabila ramane ceruta de
      # fisierul de baza; o lasam sa se propage.
      ACME_EMAIL: ${ACME_EMAIL:-nefolosit@example.com}
